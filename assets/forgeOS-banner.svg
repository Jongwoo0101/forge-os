<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <linearGradient id="osBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="50%" stop-color="#111622" />
      <stop offset="100%" stop-color="#07090E" />
    </linearGradient>

    <linearGradient id="osFireGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A00" />
      <stop offset="45%" stop-color="#FF6B00" />
      <stop offset="85%" stop-color="#FFB700" />
      <stop offset="100%" stop-color="#FFF0B3" />
    </linearGradient>

    <linearGradient id="osGuiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <linearGradient id="osSteelLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="100%" stop-color="#1A202C" />
    </linearGradient>
    <linearGradient id="osSteelRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" />
      <stop offset="100%" stop-color="#2D3748" />
    </linearGradient>
    <linearGradient id="osSteelTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#718096" />
      <stop offset="100%" stop-color="#4A5568" />
    </linearGradient>

    <filter id="osCoreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="osSubtleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="320" rx="20" fill="url(#osBgGrad)" stroke="#1F2937" stroke-width="1.5" />

  <g opacity="0.05" stroke="#A855F7" stroke-width="1.2">
    <line x1="80" y1="0" x2="80" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="320" y1="0" x2="320" y2="320" />
    <line x1="440" y1="0" x2="440" y2="320" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="240" x2="1000" y2="240" />
  </g>

  <circle cx="215" cy="160" r="110" fill="#FF5500" opacity="0.18" filter="url(#osCoreGlow)" />
  <circle cx="215" cy="160" r="60" fill="#D946EF" opacity="0.1" filter="url(#osCoreGlow)" />

  <g transform="translate(90, 38)">
    <path d="M 65 210 L 185 210 L 205 235 L 45 235 Z" fill="#141923" stroke="#2D3748" stroke-width="1.5" />

    <path d="M 95 160 L 155 160 L 165 210 L 85 210 Z" fill="#1A202C" stroke="#2D3748" stroke-width="1.5" />

    <path d="M 40 100 L 125 100 L 125 160 L 75 160 L 30 115 Z" fill="url(#osSteelLeft)" stroke="#374151" stroke-width="1.5" />

    <path d="M 125 100 L 215 100 L 225 125 L 185 160 L 125 160 Z" fill="url(#osSteelRight)" stroke="#4B5563" stroke-width="1.5" />

    <polygon points="40,100 80,75 225,75 215,100" fill="url(#osSteelTop)" stroke="#718096" stroke-width="1.5" />

    <g stroke="#FF6B00" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#osSubtleGlow)">
      <path d="M 50 115 L 75 135 L 105 135" />
      <circle cx="105" cy="135" r="2.5" fill="#FFB700" />
      <path d="M 85 180 L 110 180 L 120 195" />
      <circle cx="85" cy="180" r="2.5" fill="#FF6B00" />
    </g>

    <g stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#osSubtleGlow)">
      <path d="M 175 110 L 205 110 L 195 125 L 165 125 Z" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
      <path d="M 155 125 L 185 125 L 175 140 L 145 140 Z" stroke="#D946EF" stroke-width="2" opacity="0.9"/>
      
      <circle cx="152" cy="131" r="1.5" fill="#FF5F56" stroke="none" />
      <circle cx="157" cy="131" r="1.5" fill="#FFBD2E" stroke="none" />
      <circle cx="162" cy="131" r="1.5" fill="#27C93F" stroke="none" />
    </g>

    <g filter="url(#osCoreGlow)">
      <path d="M 125 35 C 145 65, 170 85, 155 125 C 140 105, 135 115, 125 125 C 115 115, 110 105, 95 125 C 80 85, 105 65, 125 35 Z" fill="url(#osFireGrad)" />
      <path d="M 125 65 C 135 85, 145 95, 138 115 C 130 108, 125 112, 125 118 C 125 112, 120 108, 112 115 C 105 95, 115 85, 125 65 Z" fill="#FFFFFF" opacity="0.95" />
    </g>

    <circle cx="108" cy="42" r="2" fill="#FFD000" filter="url(#osSubtleGlow)" />
    <circle cx="145" cy="30" r="2.5" fill="#D946EF" filter="url(#osSubtleGlow)" />
    <circle cx="130" cy="15" r="1.8" fill="#FFF" filter="url(#osSubtleGlow)" />
  </g>

  <g transform="translate(370, 0)">
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="6" fill="#FFFFFF">
      FORGE
    </text>

    <text x="260" y="132" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="url(#osGuiGrad)">
      OS
    </text>

    <circle cx="365" cy="85" r="5" fill="#EC4899" filter="url(#osSubtleGlow)" />

    <text x="4" y="174" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif" font-weight="500" font-size="18" fill="#94A3B8" letter-spacing="0.5">
      Graphical Desktop Environment for ForgeFramework
    </text>

    <g transform="translate(4, 202)">
      <rect x="0" y="0" width="95" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="12" cy="13" r="3.5" fill="#FF6B00" />
      <text x="24" y="17" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'SF Mono', monospace" font-weight="600" font-size="11" fill="#E2E8F0" letter-spacing="0.5">JAVAFX 21</text>

      <rect x="105" y="0" width="115" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="117" cy="13" r="3.5" fill="#A855F7" />
      <text x="129" y="17" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'SF Mono', monospace" font-weight="600" font-size="11" fill="#E2E8F0" letter-spacing="0.5">DESKTOP GUI</text>

      <rect x="230" y="0" width="135" height="26" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1" />
      <circle cx="242" cy="13" r="3.5" fill="#00F0FF" />
      <text x="254" y="17" font-family="-apple-system, BlinkMacSystemFont, 'JetBrains Mono', 'SF Mono', monospace" font-weight="600" font-size="11" fill="#E2E8F0" letter-spacing="0.5">WINDOW MANAGER</text>
    </g>
  </g>
</svg>
