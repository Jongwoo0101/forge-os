version=1.1.0

# mavenLocal 에서 가져오는 Forge Ecosystem 구성요소 버전.
# 각 저장소에서 `./gradlew publishToMavenLocal` 로 설치한 버전과 일치해야 한다.
#
# 1.1.0 부터 세 저장소의 번호를 맞춰 둔다. "어느 커널에 맞는 CLI 이고, 어느
# CLI 에 맞는 OS 인가"를 표에서 찾아보게 만들지 않으려는 것이다.
forgeFrameworkVersion=1.1.0
forgeCliVersion=1.1.0

# JavaFX. Java 21 과 짝이 맞는 LTS 라인을 고정한다.
javafxVersion=21.0.5

org.gradle.parallel=true
org.gradle.caching=true
